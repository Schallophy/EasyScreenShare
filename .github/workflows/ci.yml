name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # 核心协议/编解码：不依赖 livekit，反馈快
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-check-

      - name: Check
        run: cargo check -p ess-core -p ess-codec-palette -p ess-codec-png

      - name: Test
        run: cargo test -p ess-core -p ess-codec-palette -p ess-codec-png

  server:
    # ess-server 不依赖 webrtc-sys：不用装任何系统库，构建只要一两分钟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-server-

      - name: Build web assets
        run: bash scripts/build-web.sh

      - name: Build ess-server
        run: cargo build --release -p ess-server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ess-server
          path: target/release/ess-server
          retention-days: 7
