name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发（仅构建测试，不发 Release）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 给观看页（ess-web）用；宿主目标默认 linux-gnu
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build web assets
        # 生成 ess_web.wasm + livekit-client.umd.js（都不入库，由脚本取回/编译）
        run: bash scripts/build-web.sh

      - name: Build ess-server
        # ess-server 只依赖 ess-viewer（tokio + livekit-token），不编译 webrtc-sys
        run: cargo build --release -p ess-server

      - name: Package
        run: |
          set -e
          mkdir -p dist/ess-server-linux-x86_64/web
          cp target/release/ess-server dist/ess-server-linux-x86_64/
          # ess-server 在程序目录下的 web/ 找观看页
          cp crates/ess-web/web/index.html dist/ess-server-linux-x86_64/web/
          cp crates/ess-web/web/app.js dist/ess-server-linux-x86_64/web/
          cp crates/ess-web/web/ess_web.wasm dist/ess-server-linux-x86_64/web/
          cp crates/ess-web/web/livekit-client.umd.js dist/ess-server-linux-x86_64/web/
          # 部署脚本（install/uninstall 是薄壳，逻辑都在 ess-server 自身）
          cp deploy/install.sh deploy/uninstall.sh deploy/README.md deploy/easy-install.sh dist/ess-server-linux-x86_64/
          tar -czvf ess-server-linux-x86_64.tar.gz -C dist ess-server-linux-x86_64
          echo "=== 包内容 ==="
          tar -tzvf ess-server-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ess-server-linux-x86_64
          path: ess-server-linux-x86_64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ess-server-linux-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ess-server-linux-x86_64.tar.gz
          generate_release_notes: true
