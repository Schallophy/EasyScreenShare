name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build web assets
        run: scripts/build-web.sh
        env:
          CI: true

      - name: Build ess-server
        run: cargo build --release -p ess-app --features server --bin ess-server

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/ess-server dist/
          cp -r target/wasm32-unknown-unknown/release/ess_web.wasm dist/ 2>/dev/null || true
          cp crates/ess-web/web/index.html dist/ 2>/dev/null || true
          cp crates/ess-web/web/app.js dist/ 2>/dev/null || true
          cp -r deploy/* dist/
          cd dist && tar -czvf ess-server-linux-x86_64.tar.gz ess-server install.sh uninstall.sh easyscreenshare.service README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ess-server-linux-x86_64
          path: dist/ess-server-linux-x86_64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ess-server-linux-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ess-server-linux-x86_64.tar.gz
          generate_release_notes: true
          body: |
            ## EasyScreenShare 服务端

            ### 安装
            ```bash
            # 下载
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ess-server-linux-x86_64.tar.gz
            tar -xzf ess-server-linux-x86_64.tar.gz

            # 一键部署
            sudo bash install.sh
            ```

            ### 使用
            服务启动后会打印：
            - 观看页地址
            - API Key / Secret
            - 分享端命令

            观看端浏览器打开即可，分享端填入打印的参数。
