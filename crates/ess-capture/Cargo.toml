[package]
name = "ess-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
ess-core = { path = "../ess-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
# DXGI 桌面复制（60 fps 档）走 COM，需要完整的 windows 绑定；GDI 通路仍用 windows-sys
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
] }
