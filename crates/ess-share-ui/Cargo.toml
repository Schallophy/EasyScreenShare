[package]
name = "ess-share-ui"
version = "0.1.0"
edition = "2021"
description = "屏幕共享的图形外壳（Tauri）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ess-app = { path = "../ess-app" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ess-session = { path = "../ess-session" }
tokio = { version = "1", features = ["time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
