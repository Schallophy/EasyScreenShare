[package]
name = "ess-audio"
version = "0.1.0"
edition = "2021"

[target.'cfg(windows)'.dependencies]
# WASAPI 环回是 COM 接口，需要完整 windows 绑定（与 ess-capture 的 DXGI 通路同一套）
# Win32_System_Variant + StructuredStorage 是 IMMDevice::Activate 的 cfg 门槛，少一个方法就不存在
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
