<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>屏幕共享 · 观看</title>
<style>
  :root {
    --fg: #dbe7ff; --bg: #0b0d10; --muted: #93a9c4;
    --panel: rgba(12, 16, 22, .78); --line: rgba(120, 180, 255, .25); --accent: #4da3ff;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body {
    color: var(--fg); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }

  /* 画面层：canvas 与 video 互斥显示，缩放/平移统一作用在 #content 上。
     transform-origin 固定 0 0，JS 直接给 translate + scale，坐标换算最简单。 */
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: default; }
  #content { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: max-content; height: max-content; }
  #content canvas, #content video { display: block; max-width: none; max-height: none; background: #000; }
  /* 属性 hidden 的优先级低于上面的 display:block，必须显式压回去，
     否则图块/视频两个平面会同时显示、都跟着缩放。 */
  #content canvas[hidden], #content video[hidden] { display: none; }
  #content video { object-fit: contain; }
  #content canvas { image-rendering: pixelated; }
  body.idle #stage { cursor: none; }

  /* 顶栏：桌面端的主控区，3 s 无操作自动淡出。 */
  #chrome {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    display: flex; gap: 10px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 14px 12px;
    background: linear-gradient(180deg, rgba(5, 8, 12, .85), rgba(5, 8, 12, 0));
    transition: opacity .18s ease;
  }
  body.idle #chrome { opacity: 0; pointer-events: none; }
  #status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #status b { color: #eaf4ff; font-weight: 600; }
  #zoomLabel { color: #8fb2da; min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 8px; padding: 7px 11px; font: inherit; cursor: pointer; backdrop-filter: blur(8px);
  }
  .btn:hover { border-color: var(--accent); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: #fff; background: rgba(77, 163, 255, .22); }
  .btn[hidden] { display: none; }

  /* 技术详情默认不显示：桌面端也不要一上来就被计数器糊住。 */
  #hud {
    position: fixed; left: 10px; bottom: 10px; max-width: calc(100vw - 20px); padding: 6px 9px;
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #9fe; background: rgba(0, 0, 0, .5);
    border-radius: 6px; pointer-events: none; white-space: pre-wrap; display: none;
  }
  body.debug #hud { display: block; }

  #banner {
    position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: rgba(186, 120, 20, .94); color: #fff; padding: 6px 14px; border-radius: 999px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  #banner.on { opacity: 1; }

  #overlay {
    position: fixed; inset: 0; z-index: 15; padding: 24px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(ellipse at center, rgba(14, 20, 30, .9), rgba(5, 7, 10, .97));
  }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0; font-size: 17px; font-weight: 600; }
  #overlay p { margin: 0; color: var(--muted); max-width: 560px; }
  #spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(120, 180, 255, .25); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  #spin[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: rgba(77, 163, 255, .95); color: #fff; padding: 8px 14px; border-radius: 999px;
    font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="stage">
  <div id="content">
    <canvas id="screen" width="16" height="9"></canvas>
    <video id="stream" autoplay playsinline muted hidden></video>
  </div>
</div>

<div id="chrome">
  <div id="status">正在连接…</div>
  <span id="zoomLabel">适应</span>
  <button id="fit" class="btn" title="适应窗口 / 1:1（0 / 1）">1:1</button>
  <button id="sound" class="btn" hidden>🔇 声音：关</button>
  <button id="debug" class="btn" title="显示/隐藏技术详情">详情</button>
  <button id="fullscreen" class="btn" title="全屏（F）">全屏</button>
</div>

<div id="hud"></div>
<div id="banner"></div>

<div id="overlay">
  <div id="spin"></div>
  <h2 id="ovTitle">正在连接分享端…</h2>
  <p id="ovText">正在获取房间令牌</p>
  <button id="retry" class="btn" hidden>重新加载</button>
</div>

<div id="toast"></div>

<script src="livekit-client.umd.js"></script>
<!-- 资源版本号：改 app.js / ess_web.wasm 时同时改这两个 query（app.js 里 wasm 的
     query 也要同步），否则浏览器会命中 60 s 缓存，手机上还是旧界面。 -->
<script src="app.js?v=20261105e"></script>
</body>
</html>
