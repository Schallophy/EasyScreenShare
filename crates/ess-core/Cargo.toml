[package]
name = "ess-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
prost = "0.13"
# 运动帧（整帧降采样 JPEG）：30 fps 硬指标下唯一的可行载荷
jpeg-encoder = "0.6"
